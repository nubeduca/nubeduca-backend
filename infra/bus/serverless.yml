org: marianosanchez
service: nubeduca-infra-bus

provider:
  name: aws
  region: us-east-1
  stage: ${opt:stage, 'dev'}

custom:
  busName: ${ssm:/nubeduca/${sls:stage}/bus-name, 'lms-${sls:stage}'}

resources:
  Resources:
    BusLms:
      Type: AWS::Events::EventBus
      Properties:
        Name: ${self:custom.busName}

    ArchiveLms:
      Type: AWS::Events::Archive
      Properties:
        ArchiveName: ${self:custom.busName}-archive
        Description: Archivo de los eventos del bus para poder reprocesarlos
        SourceArn: !GetAtt BusLms.Arn
        RetentionDays: 7

    TopicNotasFifo:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: nubeduca-${sls:stage}-notas.fifo
        FifoTopic: true
        ContentBasedDeduplication: true

  Outputs:
    BusName:
      Value: !Ref BusLms
      Export:
        Name: nubeduca-${sls:stage}-bus-name
    BusArn:
      Value: !GetAtt BusLms.Arn
      Export:
        Name: nubeduca-${sls:stage}-bus-arn
    TopicNotasArn:
      Value: !Ref TopicNotasFifo
      Export:
        Name: nubeduca-${sls:stage}-notas-topic-arn